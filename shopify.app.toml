# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "913530fab0bd1e8ca645b9ad688faa45"
application_url = "https://iconic-shirts-coa-manager-app-production.up.railway.app"
embedded = true
name = "COA Manager"
handle = "iconic-shirts-coa-manager-app"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_all_orders,read_products,write_app_proxy,write_files,write_metaobject_definitions,write_metaobjects"

[auth]
redirect_urls = ["https://iconic-shirts-coa-manager-app-production.up.railway.app/auth/callback", "https://iconic-shirts-coa-manager-app-production.up.railway.app/auth/shopify/callback", "https://iconic-shirts-coa-manager-app-production.up.railway.app/api/auth/callback"]

[app_proxy]
url = "/proxy"
prefix = "apps"
subpath = "coa"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[build]
automatically_update_urls_on_dev = true
